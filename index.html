<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Happy Birthday Ekalllll</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- ==========================================
         BIRTHDAY PAGE
    =========================================== -->

    <div class="birthday-wrapper">

        <!-- TITLE ABOVE THE BOX -->
        <h1 class="birthday-title">
            Happy Birthday Ekalllll 🎂
        </h1>


        <!-- ======================================
             PHONE / MAIN BOX
        ======================================= -->

        <div class="phone-frame">

            <div class="main-layout">


                <!-- ==================================
                     LEFT SIDE
                =================================== -->

                <div class="left-side">


                    <!-- ==============================
                         CONTENT UNDER THE FALLING IMAGE
                    =============================== -->

                    <div
                        class="content-stage"
                        id="contentStage"
                    >


                        <!-- ==========================
                             1. KAZUHA VIDEO
                        =========================== -->

                        <video
                            id="kazuhaVideo"
                            class="stage-content stage-video active"
                            src="assets/video/kazuha.mp4"
                            autoplay
                            muted
                            loop
                            playsinline
                            preload="auto"
                        >
                        </video>



                        <!-- ==========================
                             2. WISHING YOUTUBE VIDEO
                        =========================== -->

                        <iframe
                            id="wishingVideo"
                            class="stage-content stage-video youtube-video"

                            src="https://www.youtube.com/embed/Y8gJQediglU?enablejsapi=1&playsinline=1&rel=0"

                            title="Birthday Wishing Video"

                            frameborder="0"

                            allow="
                                accelerometer;
                                autoplay;
                                clipboard-write;
                                encrypted-media;
                                gyroscope;
                                picture-in-picture;
                                web-share
                            "

                            allowfullscreen
                        >
                        </iframe>



                        <!-- ==========================
                             3. APOLOGY YOUTUBE VIDEO
                        =========================== -->

                        <iframe
                            id="apologizeVideo"
                            class="stage-content stage-video youtube-video"

                            src="https://www.youtube.com/embed/EFTQp5J4z4U?enablejsapi=1&playsinline=1&rel=0"

                            title="Apology Video"

                            frameborder="0"

                            allow="
                                accelerometer;
                                autoplay;
                                clipboard-write;
                                encrypted-media;
                                gyroscope;
                                picture-in-picture;
                                web-share
                            "

                            allowfullscreen
                        >
                        </iframe>



                        <!-- ==========================
                             4. QUOTE / MESSAGE
                        =========================== -->

                        <div
                            id="birthdayMessage"
                            class="stage-content birthday-message"
                        >

                            <div class="birthday-message-inner">

                                <span class="birthday-kicker">
                                    for you ♡
                                </span>

                                <h2 id="wishTitle">
                                    Happy Birthday!
                                </h2>

                                <p id="wishText">
                                    May your day be filled with happiness and beautiful memories.
                                </p>

                            </div>

                        </div>


                    </div>



                    <!-- ==============================
                         FALLING IMAGE
                    =============================== -->

                    <div
                        class="image-cover"
                        id="fallingImage"
                    >

                        <img
                            id="changingImage"
                            src="assets/images/image1.png"
                            alt="Birthday memory"
                        >

                    </div>


                </div>



                <!-- ==================================
                     RIGHT SIDE / SLIDER
                =================================== -->

                <div class="right-side">

                    <div
                        class="slider-rail"
                        id="sliderRail"
                    >


                        <!-- Slider line -->

                        <div class="rail-line"></div>



                        <!-- Slider dots -->

                        <div class="rail-dots">

                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>

                        </div>



                        <!-- Slider button -->

                        <div
                            class="slider-thumb"
                            id="sliderThumb"
                            aria-label="Pull birthday slider"
                        >

                            🍁

                        </div>


                    </div>

                </div>


            </div>

        </div>

    </div>



    <!-- ==========================================
         BACKGROUND MUSIC
    =========================================== -->

    <audio
        id="backgroundMusic"
        src="assets/audio/music.mp3"
        preload="auto"
        loop
    >
    </audio>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/script.js"></script>

</body>

</html>
